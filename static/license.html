<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VisualCast 商业授权激活中心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #172033 0%, #080c14 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(18, 25, 38, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 240, 255, 0.1);
      backdrop-filter: blur(20px);
      width: 100%;
      max-width: 540px;
      padding: 36px 32px;
      text-align: center;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 30px;
      padding: 6px 16px;
      color: #00f0ff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .machine-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .machine-label {
      font-size: 13px;
      color: #94a3b8;
      text-align: left;
    }
    .machine-code {
      font-family: "Consolas", monospace;
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .btn-copy {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-copy:hover {
      background: #38bdf8;
      color: #040810;
    }
    .input-wrap {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 20px;
      color: #34d399;
      font-family: "Consolas", monospace;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(16, 185, 129, 0.4);
    }
    .btn-submit:disabled {
      background: #334155;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .msg-box {
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
    }
    .msg-error { color: #f87171; }
    .msg-ok { color: #34d399; }
    .contact-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 12px;
    }
    .wechat-val {
      color: #38bdf8;
      font-weight: 600;
      font-family: monospace;
      font-size: 14px;
    }
    .btn-wechat-copy {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-wechat-copy:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <span>🛡️</span>
      <span>VISUALCAST SECURE ENGINE</span>
    </div>
    <h1>VisualCast 商业授权中心</h1>
    <p class="subtitle">动态随机申请码体系 · 一码单次核销 · 绝不可二次激活</p>

    <div class="machine-box">
      <div>
        <div class="machine-label">本机设备随机申请码 (单次有效):</div>
        <div class="machine-code" id="machine-code-disp">--------</div>
      </div>
      <button class="btn-copy" id="btn-copy-mc">复制申请码</button>
    </div>

    <div class="input-wrap">
      <label for="lic-code">输入 12 位授权激活码 (XXXX-XXXX-XXXX):</label>
      <input type="text" id="lic-code" placeholder="XXXX-XXXX-XXXX" maxlength="14" autocomplete="off" />
      <div style="font-size:11px;color:#64748b;margin-top:6px;text-align:left;">
        * 激活后本设备随机码将自动翻转更新，旧激活码立即失效，不可二次激活程序。
      </div>
    </div>

    <button class="btn-submit" id="btn-submit" onclick="submitLicense()">立即验证并激活</button>

    <div class="msg-box" id="msg-box"></div>

    <div class="contact-box">
      <span>商用采购与授权支持: <span class="wechat-val">19203642022</span></span>
      <button class="btn-wechat-copy" id="btn-copy-wechat">复制联系方式</button>
    </div>
  </div>

  <script>
    const machineCodeDisp = document.getElementById('machine-code-disp');
    const licCodeInput = document.getElementById('lic-code');
    const msgBox = document.getElementById('msg-box');
    const btnSubmit = document.getElementById('btn-submit');

    // 格式化输入为 XXXX-XXXX-XXXX
    licCodeInput.addEventListener('input', (e) => {
      let raw = e.target.value.toUpperCase().replace(/[^23456789ABCDEFGHJKLMNPQRSTUVWXYZ]/g, '');
      if (raw.length > 12) raw = raw.slice(0, 12);
      let parts = [];
      if (raw.length > 8) {
        parts = [raw.slice(0, 4), raw.slice(4, 8), raw.slice(8)];
      } else if (raw.length > 4) {
        parts = [raw.slice(0, 4), raw.slice(4)];
      } else if (raw.length > 0) {
        parts = [raw];
      }
      e.target.value = parts.join('-');
    });

    async function loadLicenseStatus() {
      try {
        const res = await fetch('/api/system/license');
        const data = await res.json();
        const codeToDisplay = (data.details && (data.details.request_code || data.details.machine_code)) || '--------';
        machineCodeDisp.textContent = codeToDisplay;

        if (data.is_valid) {
          msgBox.className = 'msg-box msg-ok';
          msgBox.textContent = '🎉 本设备已获得商业授权，正在载入播控大屏...';
          setTimeout(() => {
            window.location.href = '/player';
          }, 800);
        }
      } catch (e) {}
    }

    // 后台激活状态自动感知定时器：一旦在管理后台或远程激活成功，大屏视窗自动载入
    setInterval(async () => {
      try {
        const res = await fetch('/api/system/license');
        const data = await res.json();
        if (data.is_valid) {
          msgBox.className = 'msg-box msg-ok';
          msgBox.textContent = '🎉 检测到商业授权已激活，正在载入播控大屏...';
          setTimeout(() => {
            window.location.href = '/player';
          }, 600);
        }
      } catch (e) {}
    }, 3000);

    async function submitLicense() {
      const raw = licCodeInput.value.trim().toUpperCase().replace(/[^23456789ABCDEFGHJKLMNPQRSTUVWXYZ]/g, '');
      if (raw.length !== 12) {
        msgBox.className = 'msg-box msg-error';
        msgBox.textContent = '❌ 请输入完整的 12 位授权激活码 (格式: XXXX-XXXX-XXXX)';
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = '正在加密验签...';
      msgBox.textContent = '';

      try {
        const res = await fetch('/api/system/license', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: licCodeInput.value.trim().toUpperCase() })
        });
        const data = await res.json();
        if (data.status === 'success' || data.is_valid) {
          msgBox.className = 'msg-box msg-ok';
          msgBox.textContent = '🎉 授权激活成功！即将进入大屏播控系统...';
          setTimeout(() => {
            window.location.href = '/player';
          }, 1200);
        } else {
          msgBox.className = 'msg-box msg-error';
          msgBox.textContent = '❌ ' + (data.message || '激活码不正确或防伪校验失败');
          btnSubmit.disabled = false;
          btnSubmit.textContent = '立即验证并激活';
        }
      } catch (e) {
        msgBox.className = 'msg-box msg-error';
        msgBox.textContent = '❌ 网络请求异常，请检查服务连接';
        btnSubmit.disabled = false;
        btnSubmit.textContent = '立即验证并激活';
      }
    }

    function copyTextToClipboard(text) {
      if (!text) return Promise.reject(new Error('复制内容为空'));
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(() => fallbackCopyText(text));
      }
      return fallbackCopyText(text);
    }

    function fallbackCopyText(text) {
      return new Promise((resolve, reject) => {
        try {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.top = '0';
          textArea.style.left = '-9999px';
          textArea.style.opacity = '0';
          textArea.setAttribute('readonly', '');
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          textArea.setSelectionRange(0, 99999);
          const successful = document.execCommand('copy');
          document.body.removeChild(textArea);
          if (successful) resolve();
          else reject(new Error('execCommand 复制失败'));
        } catch (err) {
          reject(err);
        }
      });
    }

    document.getElementById('btn-copy-mc').addEventListener('click', () => {
      const mc = machineCodeDisp.textContent.trim();
      if (!mc || mc === '--------') {
        alert('申请码加载中，请稍候...');
        return;
      }
      copyTextToClipboard(mc).then(() => {
        alert('已成功复制 8 位动态申请码: ' + mc + '\n请填入【国文创加密机】签发激活码');
      }).catch(() => {
        prompt('请长按或手动复制 8 位申请码：', mc);
      });
    });

    document.getElementById('btn-copy-wechat').addEventListener('click', () => {
      copyTextToClipboard('19203642022').then(() => {
        alert('已复制授权支持联系方式: 19203642022');
      }).catch(() => {
        prompt('请复制联系方式：', '19203642022');
      });
    });

    loadLicenseStatus();
  </script>
</body>
</html>
