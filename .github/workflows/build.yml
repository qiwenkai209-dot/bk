name: VisualCast CI/CD - Build & Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Static Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/static android/app/src/main/assets/web/static
          if [ -d "static" ]; then
            cp -r static/* android/app/src/main/assets/static/ 2>/dev/null || true
            cp -r static/* android/app/src/main/assets/web/static/ 2>/dev/null || true
          fi

      - name: Build VisualCast APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build GuoWenChuang Keygen APK
        run: |
          cd android_keygen
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect Android APK Artifacts
        run: |
          mkdir -p output/android
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output/android/VisualCast.apk
          fi
          if [ -f "android_keygen/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android_keygen/app/build/outputs/apk/debug/app-debug.apk output/android/GuoWenChuang_Keygen.apk
          fi

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: visualcast-android-apks
          path: output/android/*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build VisualCast Main Executable
        run: |
          pyinstaller --noconfirm --clean VisualCast.spec

      - name: Build GuoWenChuang Keygen Executable
        run: |
          pyinstaller --noconfirm --clean "国文创加密机.spec"

      - name: Build Fleet Hub Executable
        run: |
          pyinstaller --noconfirm --clean "局域网大屏在线设备中枢.spec"

      - name: Collect Windows Executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output\windows
          if (Test-Path "dist\VisualCast.exe") { Copy-Item "dist\VisualCast.exe" "output\windows\" }
          if (Test-Path "dist\国文创加密机.exe") { Copy-Item "dist\国文创加密机.exe" "output\windows\" }
          if (Test-Path "dist\局域网大屏在线设备中枢.exe") { Copy-Item "dist\局域网大屏在线设备中枢.exe" "output\windows\" }

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: visualcast-windows-executables
          path: output/windows/*.exe
          if-no-files-found: error
