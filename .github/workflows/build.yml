name: VisualCast CI/CD - Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build VisualCast APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Sync Static Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/static android/app/src/main/assets/web/static
          if [ -d "static" ]; then
            cp -r static/* android/app/src/main/assets/static/ 2>/dev/null || true
            cp -r static/* android/app/src/main/assets/web/static/ 2>/dev/null || true
          fi

      - name: Build VisualCast APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect Single VisualCast APK
        run: |
          mkdir -p output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/VisualCast.apk
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output/VisualCast.apk
          fi

      - name: Upload VisualCast APK (Single Uncompressed File)
        uses: actions/upload-artifact@v4
        with:
          name: VisualCast.apk
          path: output/VisualCast.apk
          if-no-files-found: error

