name: VisualCast CI/CD - Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build VisualCast APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Sync Static Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/static android/app/src/main/assets/web/static
          if [ -d "static" ]; then
            cp -r static/* android/app/src/main/assets/static/ 2>/dev/null || true
            cp -r static/* android/app/src/main/assets/web/static/ 2>/dev/null || true
          fi

      - name: Build VisualCast APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect Single VisualCast APK
        run: |
          mkdir -p output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/VisualCast.apk
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output/VisualCast.apk
          fi

      - name: Upload VisualCast APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisualCast-Artifact
          path: output/VisualCast.apk
          if-no-files-found: error

      - name: Update latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Release VisualCast.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "VisualCast 最新构建 (${{ github.sha }})"
          body: |
            ## 🚀 VisualCast 展馆智能播控平台自动构建
            - **Commit**: ${{ github.sha }}
            - **分支**: main
            - **构建环境**: GitHub Actions (Ubuntu / Temurin JDK 17)
            - **下载说明**: 直接点击下方 `VisualCast.apk` 资产即可下载，无需解压。
          files: output/VisualCast.apk
          draft: false
          prerelease: false


